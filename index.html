<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a12" />
  <title>Bunny RTC</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Wallpaper layer -->
  <div class="bg" id="bg">
    <video id="bg-video" autoplay muted loop playsinline hidden></video>
  </div>
  <div class="bg-overlay"></div>

  <div class="app">
    <!-- Top bar -->
    <header class="top glass">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3c-1.5 2.5-4 4-4 7.5a4 4 0 0 0 8 0c0-3.5-2.5-5-4-7.5z"/>
            <path d="M8.5 14.5c.8 1.8 2 2.5 3.5 2.5s2.7-.7 3.5-2.5"/>
            <circle cx="9.5" cy="11" r="0.8" fill="currentColor" stroke="none"/>
            <circle cx="14.5" cy="11" r="0.8" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <span>Bunny RTC</span>
      </div>

      <div class="top-right">
        <div class="online">
          <span class="dot"></span>
          <span id="header-online-count">Connecting…</span>
        </div>
        <button id="invite-button" class="ghost" type="button" title="Copy invite link">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span>Invite</span>
        </button>
      </div>
    </header>

    <!-- Main chat panel -->
    <section class="panel glass">
      <div class="panel-head">
        <div>
          <h1>Shared Room</h1>
          <p>Everyone who visits is here</p>
        </div>
        <div class="status" id="connection-banner" data-state="connecting">
          <span class="status-dot"></span>
          <span id="connection-label">Connecting…</span>
          <button id="reconnect-button" type="button" hidden>Reconnect</button>
        </div>
      </div>

      <div id="message-list" class="messages" aria-live="polite"></div>

      <div class="footer">
        <div class="composer-box">
          <form id="message-form" class="composer">
            <button id="emoji-button" class="icon-btn" type="button" title="Emoji">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M8.5 14.5s1.5 2 3.5 2 3.5-2 3.5-2"/>
                <circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/>
                <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/>
              </svg>
            </button>
            <input id="message-input" maxlength="500" autocomplete="off" placeholder="Message everyone…" disabled />
            <button class="send-btn" type="submit" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/>
                <path d="M12 5l7 7-7 7"/>
              </svg>
            </button>
          </form>

          <div id="emoji-picker" class="emoji-picker glass" hidden>
            <div class="emoji-title">Emoji</div>
            <div class="emoji-grid" id="emoji-grid"></div>
          </div>
        </div>

        <div class="user-bar">
          <div class="user">
            <div id="self-avatar" class="avatar sm">?</div>
            <div class="user-info">
              <strong id="self-name">Guest</strong>
              <span>you</span>
            </div>
            <button id="name-button" class="icon-btn sm" type="button" title="Change name">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
              </svg>
            </button>
          </div>
          <span class="hint">Enter to send</span>
        </div>
      </div>
    </section>
  </div>

  <dialog id="name-dialog" class="glass">
    <form id="name-form" method="dialog">
      <h2>Display name</h2>
      <p>This name shows next to your messages.</p>
      <label for="name-input">Name</label>
      <input id="name-input" maxlength="24" minlength="2" autocomplete="nickname" required />
      <div class="dialog-actions">
        <button id="cancel-name" type="button">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js?v=liquid3" defer></script>
</body>
</html>
